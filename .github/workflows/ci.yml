name: CI

# Every PR and every push to main, with no path filter; main runs are the after-merge
# smoke check. Suites use no model, credential, network, GitHub writes, third-party actions
# or package installs. Checkout uses only the read-only GITHUB_TOKEN, never persisted;
# job names stay stable. docs/agents/build.md lists what each runs.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  linux:
    name: linux
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the event commit and its first parent
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Stored-form check
        run: python3 tests/run.py stored-form
      - name: Release check
        run: python3 tests/run.py release-check --base HEAD^1 --head HEAD
      - name: Linux suites
        run: python3 tests/run.py suites --job linux

  # The macOS work runs in two shards, planned from tests/unit_durations.json; the required
  # check is the aggregate macos job below, never a shard.
  macos-shard-1:
    name: macos shard 1 of 2
    runs-on: macos-15
    timeout-minutes: 30
    outputs:
      report: ${{ steps.report.outputs.report }}
    steps:
      - name: Check out the event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Python 3.9 and bash 3.2 compatibility
        run: /usr/bin/python3 tests/run.py py39
      - name: Shard 1 of every suite under Python 3.9
        run: /usr/bin/python3 tests/run.py suites --all --shard 1/2 --report "$RUNNER_TEMP/shard.json"
      - name: Hand the shard's report to macos
        id: report
        if: always()
        run: printf 'report=%s\n' "$(cat "$RUNNER_TEMP/shard.json")" >> "$GITHUB_OUTPUT"

  macos-shard-2:
    name: macos shard 2 of 2
    runs-on: macos-15
    timeout-minutes: 30
    outputs:
      report: ${{ steps.report.outputs.report }}
    steps:
      - name: Check out the event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Shard 2 of every suite under Python 3.9
        run: /usr/bin/python3 tests/run.py suites --all --shard 2/2 --report "$RUNNER_TEMP/shard.json"
      - name: Hand the shard's report to macos
        id: report
        if: always()
        run: printf 'report=%s\n' "$(cat "$RUNNER_TEMP/shard.json")" >> "$GITHUB_OUTPUT"

  # The required check. always() runs it after a failed or cancelled shard, so it fails
  # rather than skips: GitHub counts a skipped required check as passing.
  macos:
    name: macos
    needs: [macos-shard-1, macos-shard-2]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Both shards succeeded
        env:
          SHARD_1: ${{ needs.macos-shard-1.result }}
          SHARD_2: ${{ needs.macos-shard-2.result }}
        run: echo "shard 1 $SHARD_1, shard 2 $SHARD_2"; test "$SHARD_1" = success && test "$SHARD_2" = success
      - name: Check out the event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The shards ran every unit exactly once
        env:
          REPORT_1: ${{ needs.macos-shard-1.outputs.report }}
          REPORT_2: ${{ needs.macos-shard-2.outputs.report }}
        run: python3 tests/run.py shard-check "$REPORT_1" "$REPORT_2"
