name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: linux
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the PR's merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Interpreters
        run: python3 --version && git --version && git rev-parse HEAD HEAD^1

  macos:
    name: macos
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Check out the PR's merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Interpreters
        run: /usr/bin/python3 --version && /bin/bash --version && python3 --version && git --version
