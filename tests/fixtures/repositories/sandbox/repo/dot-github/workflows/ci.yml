name: ci

# One job on every PR, with no package install and only a SHA-pinned action, so it goes
# green on every sandbox PR. Its name is the sandbox's one confirmed required check.
on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v
