# Generated by governance model version 1, except `confirmed`. Only the generator changes the rest; `confirmed` follows AGENTS.md, Governance files.
#
# PROTOTYPE NOTE: in the sample repository this is `.github/governance/record.yml`.
# The governance gate reads this file from the default branch, never from the PR.

version: 1

# Fixed: identical in every governed repository at version 1. Floor: medium.
default_sensitive_paths:
  - "AGENTS.md"
  - "**/AGENTS.md"
  - "**/AGENTS.override.md"
  - "**/CLAUDE.md"
  - "docs/agents/**"
  - ".claude/**"
  - ".opencode/**"
  - "opencode.json"
  - ".dsh/**"
  - ".agents/**"
  - ".codex/**"
  - ".cursor/**"
  - ".github/**"

# Confirmed by habit at Initialize, quoted verbatim in the Initialize issue.
confirmed:
  sensitive_paths:
    - path: "src/sync/auth.ts"
      category: authentication
      floor: medium
    - path: "scripts/release.sh"
      category: release and publishing
      floor: high
  required_checks:
    - "test"          # .github/workflows/ci.yml, runs on every PR
  # The governance gate's own check is always required; the owner script adds it.
